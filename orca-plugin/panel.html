<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 14px 18px; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
    background: var(--background); color: var(--foreground); }
  button, input, textarea { font: inherit; color: inherit; }
  .muted { color: var(--muted-foreground); }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: var(--primary); color: var(--primary-foreground); flex: none; }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titles { min-width: 0; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px;
    background: var(--muted); border-radius: calc(var(--radius) + 2px); }
  .modes button { border: 0; background: transparent; padding: 6px 4px; border-radius: var(--radius);
    cursor: pointer; color: var(--muted-foreground); font-size: 12px; font-weight: 500; }
  .modes button[aria-pressed="true"] { background: var(--background); color: var(--foreground);
    box-shadow: 0 1px 2px rgb(0 0 0 / 0.18); }
  .hint { margin: 6px 2px 12px; font-size: 11.5px; min-height: 2.9em; }

  .field { position: relative; }
  textarea { width: 100%; min-height: 108px; resize: vertical; padding: 10px 10px 26px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
  textarea:focus, input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 25%, transparent); }
  .kbd { position: absolute; right: 8px; bottom: 8px; font-size: 10.5px; pointer-events: none; }

  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .budget { display: flex; align-items: center; margin-left: auto; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--card); padding-left: 8px; }
  .budget input { width: 54px; border: 0; background: transparent; padding: 5px 6px; outline: none; box-shadow: none; }

  .terminals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { border: 1px solid var(--border); background: transparent; border-radius: 999px;
    padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .chip[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 14%, transparent); }
  .icon-btn { border: 0; background: transparent; cursor: pointer; padding: 2px; display: grid; color: var(--muted-foreground); }

  .preview { margin-top: 12px; padding: 8px 10px; border-radius: var(--radius); background: var(--muted);
    font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; min-height: 2.6em; }
  .go { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: var(--radius); cursor: pointer;
    background: var(--primary); color: var(--primary-foreground); font-weight: 600; }
  .go:disabled { opacity: 0.45; cursor: not-allowed; }
  #status { margin: 8px 2px 0; font-size: 11.5px; min-height: 1.5em; }
  #status.error { color: var(--destructive); }

  hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0 12px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .tool { text-align: left; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius);
    padding: 7px 9px; cursor: pointer; }
  .tool b { display: block; font-size: 12px; font-weight: 600; }
  .tool span { font-size: 11px; }
  .tool:hover, .chip:hover { border-color: var(--ring); }
</style>

<header>
  <div class="mark" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M4 18V12M9 18V6M14 18V9M19 18V4"/>
    </svg>
  </div>
  <div class="titles">
    <h1>Concerto</h1>
    <p class="muted" id="worktree">No worktree focused</p>
  </div>
</header>

<div class="modes" role="group" aria-label="Mode">
  <button data-mode="plan" aria-pressed="true">Plan</button>
  <button data-mode="build" aria-pressed="false">Build here</button>
  <button data-mode="orca" aria-pressed="false">New worktree</button>
</div>
<p class="hint muted" id="hint"></p>

<div class="field">
  <textarea id="request" placeholder="What should Concerto do? e.g. add rate limiting to the login route"></textarea>
  <span class="kbd muted">Ctrl ⏎ to send</span>
</div>

<div class="row">
  <span class="label muted">Terminal</span>
  <button class="icon-btn" id="reload" title="Reload terminals" aria-label="Reload terminals">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
  </button>
  <label class="budget muted" title="Stop starting stories past this spend">$<input id="budget" type="number" min="0" step="0.5" placeholder="max"></label>
</div>
<div class="terminals" id="terminals"></div>

<div class="preview" id="preview"></div>
<button class="go" id="go">Plan it</button>
<p id="status" class="muted">Pick a terminal that shows a shell prompt, not an agent.</p>

<hr>
<span class="label muted">Tools</span>
<div class="tools">
  <button class="tool" data-tool="--doctor"><b>Doctor</b><span class="muted">Logins and installs</span></button>
  <button class="tool" data-tool="--models"><b>Models</b><span class="muted">Routes and chains</span></button>
  <button class="tool" data-tool="--probe"><b>Probe</b><span class="muted">Ping every model</span></button>
  <button class="tool" data-tool="--stats"><b>Stats</b><span class="muted">Tokens and cache</span></button>
</div>

<script>
  "use strict";
  const MODES = {
    plan: { flag: "--plan", cta: "Plan it", hint: "Score the request into user stories and print the plan. Nothing is built." },
    build: { flag: "", cta: "Build it here", hint: "Open the Concerto TUI on this worktree with the request. You confirm before anything is built." },
    orca: { flag: "--orca", cta: "Build in a new worktree", hint: "Create a fresh Orca worktree and build there in its own tab. Your branch is not touched." },
  };
  const state = { mode: "plan", terminalId: "", terminals: [] };
  const pending = new Map();
  let nextId = 0;
  const $ = (id) => document.getElementById(id);

  function call(action, params) {
    const requestId = String(++nextId);
    window.parent.postMessage({ type: "orca-panel-action", requestId, action, params }, "*");
    return new Promise((resolve, reject) => pending.set(requestId, { resolve, reject }));
  }

  window.addEventListener("message", (event) => {
    const reply = event.data;
    if (!reply || reply.type !== "orca-panel-action-result" || !pending.has(reply.requestId)) return;
    const { resolve, reject } = pending.get(reply.requestId);
    pending.delete(reply.requestId);
    reply.ok ? resolve(reply.value) : reject(new Error(reply.error));
  });

  function say(text, isError) {
    $("status").textContent = text;
    $("status").className = isError ? "error" : "muted";
  }

  const quote = (text) => `'${text.replace(/'/g, `'\\''`)}'`;

  function command() {
    const request = $("request").value.trim();
    const budget = Number($("budget").value);
    const parts = ["concerto", MODES[state.mode].flag];
    if (budget > 0) parts.push(`--budget ${budget}`);
    if (request) parts.push(quote(request));
    return parts.filter(Boolean).join(" ");
  }

  function render() {
    document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));
    $("hint").textContent = MODES[state.mode].hint;
    $("go").textContent = MODES[state.mode].cta;
    $("preview").textContent = `$ ${command()}`;
    $("go").disabled = !state.terminalId || (state.mode !== "build" && !$("request").value.trim());
  }

  function renderTerminals() {
    const chips = state.terminals.map((terminal, index) => {
      const chip = Object.assign(document.createElement("button"), { className: "chip", textContent: `Terminal ${index + 1}` });
      chip.setAttribute("aria-pressed", String(terminal.id === state.terminalId));
      chip.addEventListener("click", () => { state.terminalId = terminal.id; renderTerminals(); render(); });
      return chip;
    });
    $("terminals").replaceChildren(...chips);
    if (!chips.length) $("terminals").textContent = "Open a terminal in this worktree first.";
  }

  async function loadContext() {
    const context = await call("workspace.readContext");
    state.terminals = context ? context.terminals : [];
    if (!state.terminals.some((t) => t.id === state.terminalId)) state.terminalId = state.terminals[0]?.id ?? "";
    $("worktree").textContent = context ? `${context.displayName} · ${context.branch.replace(/^refs\/heads\//, "")}` : "No worktree focused";
    renderTerminals();
    render();
  }

  async function send(text) {
    if (!state.terminalId) return say("Open a terminal in this worktree first.", true);
    const result = await call("terminal.sendText", { terminalId: state.terminalId, text, enter: true });
    say(result.accepted ? `Sent to Terminal ${state.terminals.findIndex((t) => t.id === state.terminalId) + 1}.` : "The terminal did not accept the command.", !result.accepted);
  }

  const run = (text) => send(text).catch((error) => say(error.message, true));

  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
  document.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", () => run(`concerto ${b.dataset.tool}`)));
  $("request").addEventListener("input", render);
  $("budget").addEventListener("input", render);
  $("request").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && !$("go").disabled) run(command()); });
  $("go").addEventListener("click", () => run(command()));
  $("reload").addEventListener("click", () => loadContext().catch((e) => say(e.message, true)));
  window.addEventListener("focus", () => loadContext().catch(() => {}));
  render();
  loadContext().catch((error) => say(error.message, true));
</script>
