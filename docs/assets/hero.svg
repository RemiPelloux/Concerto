@keyframes p2off { 0%, 38% { opacity: 1; } 39.5%, 92% { opacity: 0; } 95%, 100% { opacity: 1; } }
.p2 { animation: p2 8s linear infinite; }
.mark-on.p2t { animation: p2on 8s linear infinite; }
.mark-off.p2t { animation: p2off 8s linear infinite; }
@keyframes p3 {
