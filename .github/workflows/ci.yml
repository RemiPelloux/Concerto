name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Neovim and bubblewrap, for the plugin's and the sandbox's tests
        run: |
          sudo apt-get install -y --no-install-recommends neovim bubblewrap
          # Ubuntu 24.04 stops unprivileged user namespaces by default; the sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Tests (SmartTest picks the affected ones on pull requests)
        run: pnpm exec smarttest ci
      - name: Pelloux audit
        run: pnpm pelloux
      - run: pnpm build
      - name: Performance budgets (startup, scoring, frame time)
        run: pnpm perf:budgets
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
  portability:
    # The suite on macOS and Windows: paths, PATHEXT, .cmd shims and process handling differ there.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
