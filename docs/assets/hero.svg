@keyframes d3 {
  0%, 15.5% { stroke-dashoffset: 0; opacity: 0; }
  16% { stroke-dashoffset: 0; opacity: 1; }
  28% { stroke-dashoffset: -100; opacity: 1; }
  28.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.d3 { animation: d3 8s linear infinite; }
@keyframes r1 {
  0%, 43.5% { stroke-dashoffset: 0; opacity: 0; }
  44% { stroke-dashoffset: 0; opacity: 1; }
  54% { stroke-dashoffset: -100; opacity: 1; }
  54.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.r1 { animation: r1 8s linear infinite; }
@keyframes r2 {
  0%, 46.5% { stroke-dashoffset: 0; opacity: 0; }
  47% { stroke-dashoffset: 0; opacity: 1; }
  57% { stroke-dashoffset: -100; opacity: 1; }
  57.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.r2 { animation: r2 8s linear infinite; }
@keyframes r3 {
  0%, 49.5% { stroke-dashoffset: 0; opacity: 0; }
  50% { stroke-dashoffset: 0; opacity: 1; }
  60% { stroke-dashoffset: -100; opacity: 1; }
  60.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.r3 { animation: r3 8s linear infinite; }
@keyframes v {
  0%, 62.5% { stroke-dashoffset: 0; opacity: 0; }
  63% { stroke-dashoffset: 0; opacity: 1; }
  70% { stroke-dashoffset: -100; opacity: 1; }
  70.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.v { animation: v 8s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  *, .dot, .bar, .pill, .mark-on, .mark-off { animation: none !important; }
  .c3 { opacity: 1; }
}
