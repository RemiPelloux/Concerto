<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Concerto</title>
  <desc id="d">A request is split into scored stories, each built by the model that fits it in its own git worktree, checked by the project's tests and a critic from another vendor, then merged. The conductor wakes at three checkpoints. Using the conductor model only as the brain costs a fraction of running it alone.</desc>
  <style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
.pill { fill: #2A2140; stroke: #B48CFF; }
.mark-off { opacity: 0; }
.dot { opacity: 0; }
.c0, .c1, .c2 { opacity: 0; }
.bar { transform-box: fill-box; transform-origin: 0 50%; }
.money { opacity: 1; }
.verify { fill: #133325; stroke: #4FD08A; }
.check { opacity: 1; }
.flash { stroke: #E8826A; }
.cell { fill: #4FD08A; }
@keyframes bar { 0%, 10% { transform: scaleX(0); } 70%, 92% { transform: scaleX(1); } 99%, 100% { transform: scaleX(0); } }
@keyframes money { 0%, 70% { opacity: 0; } 73%, 92% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes verify { 0%, 69% { fill: #15171C; stroke: #2A2D35; } 71%, 92% { fill: #133325; stroke: #4FD08A; } 95%, 100% { fill: #15171C; stroke: #2A2D35; } }
@keyframes check { 0%, 59% { opacity: 0; } 61%, 92% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes flash { 0%, 31% { stroke: #E8826A; } 32%, 37% { stroke: #F06A6A; } 39%, 100% { stroke: #E8826A; } }
@keyframes cell { 0%, 26% { fill: #2A2D35; } 30%, 92% { fill: #4FD08A; } 96%, 100% { fill: #2A2D35; } }
.bar { animation: bar 8s cubic-bezier(.3,.7,.3,1) infinite; }
.money { animation: money 8s linear infinite; }
.verify { animation: verify 8s linear infinite; }
.check { animation: check 8s linear infinite; }
.flash { animation: flash 8s linear infinite; }
.cell { animation: cell 8s linear infinite; }
.cell.s2 { animation-delay: .15s; } .cell.s3 { animation-delay: .3s; }
@keyframes p1 {
  0%, 6% { fill: #15171C; stroke: #2A2D35; }
  7.5%, 92% { fill: #2A2140; stroke: #B48CFF; }
  95%, 100% { fill: #15171C; stroke: #2A2D35; }
}
@keyframes p1on { 0%, 6% { opacity: 0; } 7.5%, 92% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes p1off { 0%, 6% { opacity: 1; } 7.5%, 92% { opacity: 0; } 95%, 100% { opacity: 1; } }
.p1 { animation: p1 8s linear infinite; }
.mark-on.p1t { animation: p1on 8s linear infinite; }
.mark-off.p1t { animation: p1off 8s linear infinite; }
@keyframes p2 {
