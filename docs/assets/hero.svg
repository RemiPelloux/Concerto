  75.5%, 92% { fill: #2A2140; stroke: #B48CFF; }
  95%, 100% { fill: #15171C; stroke: #2A2D35; }
}
@keyframes p3on { 0%, 74% { opacity: 0; } 75.5%, 92% { opacity: 1; } 95%, 100% { opacity: 0; } }
@keyframes p3off { 0%, 74% { opacity: 1; } 75.5%, 92% { opacity: 0; } 95%, 100% { opacity: 1; } }
.p3 { animation: p3 8s linear infinite; }
.mark-on.p3t { animation: p3on 8s linear infinite; }
.mark-off.p3t { animation: p3off 8s linear infinite; }
@keyframes c0 { 0%, 6% { opacity: 1; } 7%, 93% { opacity: 0; } 95%, 100% { opacity: 1; } }
.c0 { animation: c0 8s linear infinite; }
@keyframes c1 { 0%, 6% { opacity: 0; } 7%, 38% { opacity: 1; } 39%, 100% { opacity: 0; } }
.c1 { animation: c1 8s linear infinite; }
@keyframes c2 { 0%, 38% { opacity: 0; } 39%, 74% { opacity: 1; } 75%, 100% { opacity: 0; } }
.c2 { animation: c2 8s linear infinite; }
@keyframes c3 { 0%, 74% { opacity: 0; } 75%, 92% { opacity: 1; } 94%, 100% { opacity: 0; } }
.c3 { animation: c3 8s linear infinite; }
@keyframes d1 {
  0%, 9.5% { stroke-dashoffset: 0; opacity: 0; }
  10% { stroke-dashoffset: 0; opacity: 1; }
  22% { stroke-dashoffset: -100; opacity: 1; }
  22.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
.d1 { animation: d1 8s linear infinite; }
@keyframes d2 {
  0%, 12.5% { stroke-dashoffset: 0; opacity: 0; }
  13% { stroke-dashoffset: 0; opacity: 1; }
  25% { stroke-dashoffset: -100; opacity: 1; }
  25.5%, 100% { stroke-dashoffset: -100; opacity: 0; }
}
