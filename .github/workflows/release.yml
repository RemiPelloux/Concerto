name: Release
# Builds concerto.tar.gz (Linux, macOS) and concerto.zip (Windows), installs each with its
# installer on a real machine of that system, and attaches them to the release once all pass.
on:
  push:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            out/concerto.tar.gz
            out/concerto.zip
            scripts/install.sh
            scripts/install.ps1
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          CONCERTO_ARCHIVE="$PWD/out/concerto.tar.gz" sh scripts/install.sh
          ~/.local/bin/concerto --version
          ~/.local/bin/concerto --help
          mkdir project && cd project && git init -q && ~/.local/bin/concerto --doctor
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CONCERTO_ARCHIVE = "$PWD\out\concerto.zip"
          ./scripts/install.ps1
          $bin = Join-Path $env:LOCALAPPDATA "Concerto\bin"
          & "$bin\concerto.cmd" --version
          & "$bin\concerto.cmd" --help
          New-Item -ItemType Directory project | Out-Null
          Set-Location project
          git init -q
          & "$bin\concerto.cmd" --doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  publish:
    if: github.event_name == 'release'
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
      - run: gh release upload "$TAG" out/concerto.tar.gz out/concerto.zip scripts/install.sh scripts/install.ps1 --clobber --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
