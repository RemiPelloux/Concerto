  <g class="chk c1"><circle cx="1060" cy="197.0" r="13" fill="#133325" stroke="#4FD08A" stroke-width="1.2"/>
  <path d="M1053,197.0 l5,5 l9,-10" stroke="#4FD08A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M740,375.0 L800,375.0" stroke="#2A2D35" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="800" y="358.0" width="230" height="34" rx="17" fill="#15171C" stroke="#6AA5FF" stroke-width="1.2"/>
  <text x="816" y="379.5" fill="#6AA5FF" font-size="12.5">critic · sonnet-5.5</text>
  <g class="chk c2"><circle cx="1060" cy="375.0" r="13" fill="#133325" stroke="#4FD08A" stroke-width="1.2"/>
  <path d="M1053,375.0 l5,5 l9,-10" stroke="#4FD08A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M740,451.0 L800,451.0" stroke="#2A2D35" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="800" y="434.0" width="230" height="34" rx="17" fill="#15171C" stroke="#6AA5FF" stroke-width="1.2"/>
  <text x="816" y="455.5" fill="#6AA5FF" font-size="12.5">critic · sonnet-5.5</text>
  <g class="chk c3"><circle cx="1060" cy="451.0" r="13" fill="#133325" stroke="#4FD08A" stroke-width="1.2"/>
  <path d="M1053,451.0 l5,5 l9,-10" stroke="#4FD08A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="card k0">
    <rect x="440" y="92" width="300" height="58" rx="8" fill="#1B1E24" stroke="#E0B450" stroke-width="1.2"/>
    <text x="454" y="115" fill="#E6E3DC" font-size="13" font-weight="700">Dark mode for settings</text>
    <text x="454" y="135" fill="#8A8F98" font-size="11.5">3 pts · complexity 2 · risk 2</text>
    <rect x="640" y="101" width="34" height="18" rx="9" fill="#3A2A22"/><text x="657" y="114" fill="#E8826A" font-size="11" text-anchor="middle">ui</text>
